name: Build Project
on:
  push:
    branches-ignore: [ renovate/** ]
  pull_request:
    branches: [ main ]
env:
  ANDROID_HOME: /opt/android-sdk
jobs:
  gradle-build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Android SDK
        run: |
          mkdir $ANDROID_HOME
          cd $ANDROID_HOME
          curl --silent https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          ./cmdline-tools/bin/android sdk install platforms/android-36 --no-metrics
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: gradle/jdk-version.txt
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          build-scan-terms-of-use-url: https://gradle.com/help/legal-terms-of-use
          build-scan-terms-of-use-agree: yes
      - run: "./gradlew :plugins:test" # test the Gradle configuration
      - run: "./gradlew qualityCheck"
      - run: "./gradlew test"
      - run: "./gradlew testEndToEnd"
      - run: "./gradlew testEndToEndSlow"
      - run: "./gradlew build"
      - run: "./gradlew cyclonedxDirectBom"
        if: ${{ !contains(github.ref_name, '/') }}
      - uses: forgejo/upload-artifact@v5
        if: always()
        with:
          name: reports
          path: gradle/aggregation/build/reports

